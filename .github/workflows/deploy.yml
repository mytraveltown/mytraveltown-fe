name: Deploy React Vite App to VPS (Apache)

on:
  push:
    branches:
      - server

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      # ✅ 1. UPLOAD TO A TEMP FOLDER (User has write access here)
      - name: Upload dist to VPS Temp
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          source: "dist/"
          # Upload to the user's home directory first to avoid permission errors
          target: "/home/${{ secrets.VPS_USER }}/temp_deploy"

      # ✅ 2. MOVE TO FINAL DESTINATION (Using sudo)
      - name: Deploy and Reload
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            sudo mkdir -p /var/www/html
            
            # 2. Clear old files (Optional but recommended to prevent junk buildup)
            sudo rm -rf /var/www/html/*
            
            # 3. Move files from temp to final (Handle the dist nesting)
            # scp usually uploads as /temp_deploy/dist, so we move the contents of that
            sudo cp -r /home/${{ secrets.VPS_USER }}/temp_deploy/dist/* /var/www/html/
            
            # 4. Set Permissions
            sudo chown -R www-data:www-data /var/www/html
            sudo chmod -R 755 /var/www/html
            
            # 5. Cleanup Temp
            rm -rf /home/${{ secrets.VPS_USER }}/temp_deploy
            
            # 6. No need to restart Apache for static React files, but if you must:
            # sudo systemctl reload apache2
